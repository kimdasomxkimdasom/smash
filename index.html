<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d24" />
    <link rel="icon" type="image/svg+xml" href="tools/hammer.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>SMASH! 스트레스 풀기</title>
    <!-- CSS(style.css)가 JS로 늦게 들어오기 전에도 화면이 깨지지 않게 최소한만 먼저 -->
    <style>
      html, body { margin: 0; background: #1b1d24; }
      #app { visibility: hidden; } /* style.css가 들어오면 보이게 바뀜 */
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>

      <!-- 위: 파괴율, 시간 -->
      <header id="hud">
        <div class="meter"><div id="meter-fill"></div></div>
        <div class="stats">
          <span id="percent">0%</span>
          <span id="timer">0.0s</span>
        </div>
      </header>

      <!-- 아래: 도구 선택 -->
      <nav id="tools">
        <button data-tool="hammer" class="active">
          <img class="tool-icon" src="tools/hammer.svg" width="32" height="32" alt="" />
          망치
        </button>
        <button data-tool="bat">
          <img class="tool-icon" src="tools/baseball-bat.svg" width="32" height="32" alt="" />
          방망이
        </button>
        <button data-tool="flame">
          <img class="tool-icon" src="tools/torch.svg" width="32" height="32" alt="" />
          화염
        </button>
      </nav>

      <!-- 시작 화면 -->
      <section id="start" class="overlay">
        <h1>SMASH!</h1>
        <p class="sub">스트레스 풀기</p>
        <p class="desc">오늘은 뭘 부숴 볼까요?</p>
        <div class="targets">
          <button data-target="computer"><span>🖥️</span>컴퓨터</button>
          <button data-target="car"><span>🚗</span>자동차</button>
        </div>
        <p class="hint">탭: 때리기 · 꾹 누르기: 연타 · 화염은 누른 채로 문지르기</p>
      </section>

      <!-- 결과 화면 -->
      <section id="result" class="overlay hidden">
        <h2>박살 완료!</h2>
        <p id="result-text"></p>
        <div class="result-actions">
          <button id="again-btn">다시 부수기</button>
          <button id="home-btn" class="secondary">다른 거 부수기</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
